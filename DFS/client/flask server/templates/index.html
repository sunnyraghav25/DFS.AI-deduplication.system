<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SunnyDFS | AI Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">
    <div class="text-center">
        <h1 class="text-6xl font-bold mb-6">SunnyDFS</h1>
        <p class="text-xl text-gray-400 mb-10">AI-Powered Distributed File Storage System</p>
        <button onclick="startProcess()" class="bg-blue-600 px-10 py-4 rounded-full font-bold text-lg hover:bg-blue-500 transition-all">

    </div>

    <script>
        function startProcess() {
            alert("Initializing Master Server and Data Nodes...");
            window.location.href = "/dashboard";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunnyDFS - Advanced Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #0f172a; --card: #1e293b; --danger: #ff4d4d; --terminal: #000000; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .upload-box { text-align: center; border: 2px dashed #334155; padding: 20px; border-radius: 10px; background: rgba(0,0,0,0.2); }
        .btn-main { background: var(--primary); color: #000; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .terminal { background: var(--terminal); color: #00ff88; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; height: 120px; overflow-y: auto; font-size: 13px; border: 1px solid #334155; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .btn-action { background: none; border: 1px solid; padding: 6px 12px; border-radius: 5px; cursor: pointer; margin-right: 5px; transition: 0.3s; }
        .btn-del { color: var(--danger); border-color: var(--danger); }
        .btn-del:hover { background: var(--danger); color: white; }
        .btn-get { color: var(--primary); border-color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="color: var(--primary);"><i class="fas fa-microchip"></i> SunnyDFS Dashboard</h2>
        <button onclick="location.reload()" class="btn-action btn-get" style="background: var(--primary); color: #000;"><i class="fas fa-sync"></i> REFRESH SYSTEM</button>
    </div>

    <div class="grid">
        <div class="card">
            <h3><i class="fas fa-server"></i> Node Status</h3>
            <p><i class="fas fa-circle" style="color:var(--primary); font-size: 10px;"></i> Dnode1 (8888): <b>Connected</b></p>
            <p><i class="fas fa-circle" style="color:var(--primary); font-size: 10px;"></i> Dnode2 (8000): <b>Connected</b></p>
        </div>

        <div class="card">
            <h3><i class="fas fa-cloud-upload-alt"></i> Upload to Distributed Storage</h3>
            <div class="upload-box">
                <input type="file" id="fileInput" style="display: none;" onchange="document.getElementById('fileName').innerText = this.files[0].name">
                <button class="btn-main" style="background: #3b82f6; color: white; width: auto;" onclick="document.getElementById('fileInput').click()">Choose File</button>
                <span id="fileName" style="margin-left: 10px; color: #94a3b8;">No file selected</span>
                <button class="btn-main" onclick="uploadFile()">START AI DEDUPLICATION</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h3><i class="fas fa-terminal"></i> Terminal Logs</h3>
        <div class="terminal" id="logs">$ System initialized. Ready...</div>
    </div>

    <div class="card">
        <h3><i class="fas fa-database"></i> Managed Files (FileMap)</h3>
        <table>
            <thead>
                <tr>
                    <th>FILENAME</th>
                    <th>STORAGE STATUS</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody id="file-list">
                </tbody>
        </table>
    </div>
</div>

<script>
    function addLog(msg, color="#00ff88") {
        const logs = document.getElementById('logs');
        logs.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        logs.scrollTop = logs.scrollHeight;
    }

    function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) return alert("Select file first!");
        
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        addLog(`Uploading: ${fileInput.files[0].name}...`, "#3b82f6");

        fetch('/api/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                addLog(data.message);
                refreshFiles();
            });
    }

    function refreshFiles() {
    fetch('/api/files')
        .then(res => res.json())
        .then(result => {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            
            // Check if result.data exists and has items
            if (!result.data || result.data.length === 0) {
                list.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px;">No files found in storage nodes.</td></tr>';
                return;
            }

            result.data.forEach(file => {
                list.innerHTML += `
                    <tr>
                        <td><b>${file.Name}</b></td>
                        <td><span style="color:#00ff88"><i class="fas fa-server"></i> Active on ${file.Node}</span></td>
                        <td>
                            <button class="btn-action btn-get" onclick="alert('Downloading ${file.Name}...')"><i class="fas fa-download"></i></button>
                            <button class="btn-action btn-del" onclick="deleteFile('${file.Name}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        })
        .catch(err => console.error("Fetch error:", err));
}
    

    function deleteFile(name) {
        if(confirm("Delete " + name + "?")) {
            fetch(`/api/delete/${name}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                addLog(`Deleted: ${name}`, "#ff4d4d");
                refreshFiles();
            });
        }
    }

    window.onload = refreshFiles;
</script>
</body>
</html>
